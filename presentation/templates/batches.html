{% extends "base.html" %}
{% block title %}Batches{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Batches</h1>
  <p class="sub">Every inbound batch with manufactured and expiry dates.</p>
</div>

<div class="card">
  <div class="sect-title">All Batches</div>
  <div class="table-wrap">
    <table class="tbl">
      <thead><tr><th>Code</th><th>Product</th><th>Qty</th><th>Location</th><th>Supplier</th><th>Manufactured</th><th>Expiry</th></tr></thead>
      <tbody id="batchBody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/batches.js') }}"></script>
{% endblock %}
