{% extends "base.html" %}
{% block title %}Sales{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Sales & Transactions</h1>
  <div class="actions">
    <button class="btn" onclick="document.getElementById('saleModal').classList.remove('hide')">+ New Sale</button>
  </div>
</div>

<div class="grid grid-3 mb-1" id="saleKpis"></div>

<div class="card">
  <div class="sect-title">Recent Sales</div>
  <div class="table-wrap">
    <table class="tbl">
      <thead><tr><th>Invoice</th><th>Date</th><th>Payment</th><th>Subtotal</th><th>Discount</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="salesBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay hide" id="saleModal">
  <div class="modal">
    <div class="modal-head"><h3>New Sale (FEFO)</h3><button class="icon-btn" onclick="document.getElementById('saleModal').classList.add('hide')">✕</button></div>
    <form id="saleForm">
      <div class="form-row">
        <div class="field"><label>Product ID *</label><input name="product_id" type="number" required></div>
        <div class="field"><label>Quantity *</label><input name="quantity" type="number" required></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Unit price (₹)</label><input name="unit_price" type="number" step="0.01" placeholder="Leave blank for default"></div>
        <div class="field"><label>Payment method</label>
          <select name="payment_method"><option value="CASH">Cash</option><option value="CARD">Card</option><option value="UPI">UPI</option></select>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" onclick="document.getElementById('saleModal').classList.add('hide')">Cancel</button>
        <button type="submit" class="btn green">Complete Sale</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/sales.js') }}"></script>
{% endblock %}
