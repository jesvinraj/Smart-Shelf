<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · SmartShelf</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-page">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <div class="login-card">
      <div class="logo">🛒</div>
      <h1>SmartShelf</h1>
      <div class="tag">Inventory Intelligence</div>

      <div id="errorMsg" class="alert-item border-left-red hide" style="margin-bottom:1rem;">
        <span class="severity">⚠️</span><div class="body"><p id="errorText"></p></div>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <div class="field hide" id="otpField">
          <label for="otp">2FA Code</label>
          <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
        </div>
        <button class="btn" type="submit" id="loginBtn">LOGIN</button>
      </form>
      <p class="muted mt-1" style="font-size:.78rem;margin-bottom:0;">
        New here? <a href="{{ url_for('pages.register') }}">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');

    if (new URLSearchParams(window.location.search).get('registered') === '1') {
      errText.textContent = 'Account created. An admin must approve your account before you can log in.';
      errBox.classList.remove('hide');
      errBox.classList.remove('border-left-red');
      errBox.classList.add('border-left-green');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'LOGGING IN...';
      errBox.classList.add('hide');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            otp: document.getElementById('otp').value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        if (data.requires_2fa) {
          // First stage passed; now prompt for the TOTP code.
          document.getElementById('otpField').classList.remove('hide');
          document.getElementById('otp').required = true;
          document.getElementById('otp').focus();
          btn.disabled = false; btn.textContent = 'VERIFY';
          return;
        }
        window.location.href = '/';
      } catch (err) {
        errText.textContent = err.message;
        errBox.classList.remove('hide');
        btn.disabled = false; btn.textContent = 'LOGIN';
      }
    });
  </script>
</body>
</html>
