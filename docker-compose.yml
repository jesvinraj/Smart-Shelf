services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartshelf-root}
      MYSQL_DATABASE: smartshelf
      MYSQL_USER: smartshelf
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartshelf-pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-p${MYSQL_ROOT_PASSWORD:-smartshelf-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://smartshelf:${MYSQL_PASSWORD:-smartshelf-pass}@db:3306/smartshelf
      SECRET_KEY: ${SECRET_KEY:-change-me-before-deploy}
      SESSION_COOKIE_SECURE: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-entrypoint.sh:/docker/nginx-entrypoint.sh:ro
      - nginx_certs:/etc/nginx/certs
    command: ["sh", "/docker/nginx-entrypoint.sh"]

volumes:
  db_data:
  nginx_certs: